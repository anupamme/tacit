# The settle guest in SP1 execute mode over a serialized SP1Stdin (what dapp/sp1-stdin.js stdinFor builds), printing its cycles and writing the
# public values it commits. No proof is made: tests/swap-private-relay-fork.mjs runs the ops a page builds through the pinned guest this way,
# then lets the live pool check the public values. Not part of the prover harness crate (contracts/sp1/confidential/harnesses), whose binaries
# are built for the prover network.
#   GUEST_ELF=$PWD/contracts/sp1/confidential/elf/cxfer-guest cargo build --release --offline --manifest-path tests/exec-stdin/Cargo.toml
#   (CARGO_TARGET_DIR=<a target directory that already holds sp1-sdk 6.2.3's build> makes it a ten-second build)
[package]
name = "exec-stdin"
version = "0.1.0"
edition = "2021"
[workspace]

[[bin]]
name = "exec-stdin"
path = "src/main.rs"

[dependencies]
sp1-sdk = { version = "=6.2.3", features = ["blocking", "network", "native-gnark", "profiling"] }
hex = "0.4"
bincode = "1.3.3"

[profile.release]
opt-level = 3
