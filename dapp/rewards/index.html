:root {
  --paper: #E8E0CC; --card: #F2EBD4; --field: #FAF6EA;

    --hair: rgba(237,229,207,.12); --hair-2: rgba(237,229,207,.28);

    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body {
  font: 14px/1.6 var(--mono); letter-spacing: -.01em; overflow-x: hidden;
  background-image: radial-gradient(var(--hair) 1px, transparent 1px); background-size: 24px 24px;
  padding: 0 max(16px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(16px, env(safe-area-inset-left));
}
a { color: inherit; text-underline-offset: 3px; text-decoration-thickness: 1px; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 16px; top: -64px; z-index: 100; padding: 10px 16px; background: var(--ink); color: var(--paper); border-radius: 8px; text-decoration: none; font-size: 13px; transition: top .15s; }
.skip:focus { top: 12px; }
.tk { width: 28px; height: 28px; display: block; flex: none; border-radius: 50%; }
.shell { max-width: 1120px; margin: 0 auto; padding-bottom: 56px; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 22px 0 8px; }
.brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; flex: none; }
.brand b { font: italic 400 30px/1 var(--serif); letter-spacing: -.01em; }
.brand i { font-style: normal; font-size: 12px; color: var(--mute); text-transform: uppercase; letter-spacing: .12em; }

/* one centred column: the title, the bar, what it finds */
.find { max-width: 640px; margin: 0 auto; padding: clamp(28px, 9vh, 96px) 0 24px; text-align: center; }
.find h1 { font: 400 clamp(44px, 8vw, 76px)/.95 var(--serif); letter-spacing: -.025em; margin: 0 0 52px; }
.find h1 em { font-style: italic; }
#f { position: relative; }
.bar { position: relative; z-index: 1; display: flex; align-items: center; background: var(--field); border: 1px solid var(--hair); border-bottom-color: var(--ink); text-align: left; }
.bar:focus-within { border-color: var(--ink); }
.bar:has(input[aria-invalid="true"]) { border-color: var(--err); }
.bar input { flex: 1; min-width: 0; font: 400 16px/1.4 var(--mono); color: var(--ink); background: none; border: 0; padding: 16px 16px; outline: none; }
.bar input::placeholder { color: var(--mute); opacity: .8; }
.bar button { flex: none; width: var(--tap); height: var(--tap); margin-right: 4px; display: grid; place-items: center; font: 20px/1 var(--mono); color: var(--ink); background: none; border: 0; cursor: pointer; }
.bar button:disabled { opacity: .35; cursor: default; }
@media (pointer: coarse) { .bar input { font-size: 16px; } }

.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 14px 0 0; min-height: 0; }
.chips:empty { display: none; }
.chip { font: 400 13px/1 var(--mono); color: var(--ink); background: none; border: 1px solid var(--hair-2); border-radius: 999px; padding: 9px 14px; min-height: 36px; cursor: pointer; transition: border-color .15s, background .15s; }
.chip:hover { border-color: var(--ink); background: var(--field); }
.chip.x { color: var(--mute); border-color: transparent; padding: 9px 10px; }
/* the ninja peeks over the bar: a thumbs up and a nod, then a wink, for something to claim; a thumbs down and a shake for nothing */
.nin { position: absolute; right: 10px; bottom: calc(100% - 8px); width: 64px; height: 64px; z-index: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.nin .head { position: absolute; inset: 0; background: url('/rewards/ninja.png') center bottom / contain no-repeat; transform: translateY(17px); transform-origin: 50% 100%; transition: transform .35s cubic-bezier(.2, .8, .2, 1); }
.nin.wink .head { background-image: url('/rewards/ninja-wink.png'); }
.nin:hover .head { transform: translateY(9px); }
.nin[data-mood="think"] .head { transform: translateY(10px); animation: think 1s ease-in-out infinite; }
.nin[data-mood="up"] .head { transform: translateY(-4px); animation: nod 1.1s ease-in-out .12s 1; }
.nin[data-mood="down"] .head { transform: translateY(8px); animation: no 1s ease-in-out .1s 1; }
.nin[data-mood="shake"] .head { transform: translateY(8px); animation: no .7s ease-in-out 1; }
@keyframes think { 0%, 100% { transform: translateY(10px) rotate(5deg); } 50% { transform: translateY(10px) rotate(-6deg); } }
@keyframes nod { 0%, 100% { transform: translateY(-4px) rotate(0); } 18% { transform: translateY(3px) rotate(9deg); } 36% { transform: translateY(-6px) rotate(-2deg); } 54% { transform: translateY(3px) rotate(9deg); } 74% { transform: translateY(-5px) rotate(0); } }
@keyframes no { 0%, 100% { transform: translateY(8px) rotate(0); } 20% { transform: translateY(8px) rotate(-10deg); } 40% { transform: translateY(8px) rotate(10deg); } 60% { transform: translateY(8px) rotate(-7deg); } 80% { transform: translateY(8px) rotate(5deg); } }
.emo { position: absolute; right: 72px; bottom: 14px; font-size: 30px; line-height: 1; pointer-events: none; }
.emo.pop { animation: emo 2.8s cubic-bezier(.2, .9, .2, 1) both; }
@keyframes emo { 0% { transform: scale(0) rotate(-24deg); opacity: 0; } 10% { transform: scale(1.4) rotate(8deg); opacity: 1; } 22% { transform: scale(1) rotate(0); } 78% { transform: translateY(-4px); opacity: 1; } 100% { transform: translateY(-16px); opacity: 0; } }
@media (prefers-color-scheme: dark) { .nin .head { filter: drop-shadow(0 0 .7px rgba(237, 229, 207, .75)) drop-shadow(0 0 .7px rgba(237, 229, 207, .75)); } }
.done { margin: 0 0 14px; padding: 14px 18px; background: var(--card); border: 1px solid var(--ok); color: var(--ink); }
.done b { color: var(--ok); font-weight: 500; }
.done a { margin-left: 10px; }
.note-claim { margin: 0 0 14px; text-align: center; }
button.act { border: 0; font-family: var(--mono); font-size: 14px; cursor: pointer; }
button.act:disabled { opacity: .6; cursor: default; transform: none; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }
#out { margin-top: 28px; text-align: left; min-height: 1px; }
.err { color: var(--err); margin: 0; text-align: center; }
.who { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center; gap: 4px 12px; margin: 0 0 20px; text-align: center; }
.who b { font: 400 26px/1.1 var(--serif); letter-spacing: -.01em; word-break: break-all; }
.who span { color: var(--mute); font-size: 13px; }
.acts { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 18px; margin: -8px 0 18px; }
.acts a, .acts button { font: 400 13px/1.4 var(--mono); color: var(--mute); background: none; border: 0; padding: 6px 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.acts a:hover, .acts button:hover { color: var(--ink); }
.card { background: var(--card); border: 1px solid var(--hair); padding: 22px 24px 20px; margin: 0 0 14px; animation: rise .38s cubic-bezier(.2, .7, .2, 1) both; }
#c-pts .card { animation-delay: .06s; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
.card h2 { margin: 0 0 6px; font: 500 12px/1.4 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
.big { margin: 0; font: 400 clamp(38px, 7vw, 54px)/1 var(--serif); letter-spacing: -.02em; }
.big small { font: 400 15px var(--mono); letter-spacing: 0; color: var(--mute); margin-left: 8px; }
.st { margin: 8px 0 0; }
.st.ok { color: var(--ok); }
.st.warn { color: var(--warn); }
.st.mute { color: var(--mute); }
.kv { margin: 14px 0 0; display: grid; gap: 4px; }
.kv div { display: flex; justify-content: space-between; gap: 16px; padding: 6px 0; border-top: 1px solid var(--hair); }
.kv dt { color: var(--mute); }
.kv dd { margin: 0; text-align: right; }
.act { display: inline-flex; align-items: center; min-height: var(--tap); margin-top: 12px; padding: 0 18px; font-weight: 500; color: var(--paper); background: var(--ink); text-decoration: none; transition: transform .15s; }
.act:hover { transform: translateY(-1px); }
.sk { display: inline-block; height: 1em; width: 10ch; background: var(--hair); vertical-align: middle; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
