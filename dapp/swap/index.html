<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-80mS3TOMy9ezGoN/viIn593jsPNA6Uzy3OQtXg+tUFE='; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex">
<title>tacit swap</title>
<link rel="canonical" href="https://tacit.finance/">
<script>
// The swap is the front page's Swap tab: this address forwards there with the swap it names (the tile reads ?from=&to=&amt=&private=), #earn to the
// public farm, and #bitcoin to a swap between tETH and TAC on Bitcoin.
(() => {
  const q = new URLSearchParams(location.search), h = location.hash;
  if (h === '#bitcoin') { q.set('from', q.get('from') || 'tETH'); q.set('to', q.get('to') || 'TAC'); q.set('from-at', 'btc'); q.set('to-at', 'btc'); }
  const s = q.toString();
  location.replace(`/${s ? `?${s}` : ''}${h === '#earn' ? '#farm/public' : '#card=swap'}`);
})();
</script>
<meta http-equiv="refresh" content="0; url=/#card=swap">
</head>
<body><p><a href="/#card=swap">tacit swap</a></p></body>
</html>
